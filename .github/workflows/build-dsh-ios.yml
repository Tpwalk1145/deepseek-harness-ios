name: build-dsh-ios

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/**'
      - 'ios-sdk-shim/**'
      - '.github/workflows/build-dsh-ios.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 ninja + ccache
        run: brew install ninja ccache

      - name: 缓存 Node 源码与构建产物
        id: cache-node
        uses: actions/cache@v4
        with:
          path: |
            node-v22.23.2
            .ccache
          key: node-ios-build-${{ runner.arch }}-${{ hashFiles('scripts/ios/apply_patches.py', 'scripts/ios/build-*.sh', 'ios-sdk-shim/**') }}
          restore-keys: |
            node-ios-build-${{ runner.arch }}-
          # fork 上无跨仓库缓存继承，冷编译约 3 小时；即使后续步骤超时失败，
          # 也要把部分源码树/对象文件存入缓存，下次 ninja 从断点续编。
          save-always: true

      - name: 交叉编译 Node 22 for iOS + nodejs deb
        # dist/ 已提交对应版本的 nodejs deb 时跳过（编译约 3 小时，是唯一耗时步骤）；
        # Node 版本/补丁变化时删掉旧 deb 或本地编译后提交新 deb 即可。
        if: ${{ !hashFiles('dist/nodejs_22.23.2-4_iphoneos-arm64.deb') }}
        run: |
          chmod +x scripts/ios/*.sh
          ./scripts/ios/build-node-ios.sh
        # 冷编译在 macos-15-intel 上实测 >120 分钟（fork 无缓存时 2h 超时于
        # [3602/4790]，约 75%）；270 分钟覆盖冷编译 + 余量。
        timeout-minutes: 270

      - name: 打包 dsh-ios deb（node-pty addon + DSH 全量依赖）
        run: ./scripts/ios/build-dsh-ios.sh
        timeout-minutes: 60

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ios-debs
          path: |
            dist/nodejs_22.23.2-4_iphoneos-arm64.deb
            dist/dsh-ios_0.1.5-rc.2-1_iphoneos-arm64.deb
          if-no-files-found: error

      - name: 发布到 Release（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nodejs_22.23.2-4_iphoneos-arm64.deb
            dist/dsh-ios_0.1.5-rc.2-1_iphoneos-arm64.deb
          generate_release_notes: true
